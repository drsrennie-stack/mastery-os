<script>
"use strict";
(function(){
  var $=function(s){return document.querySelector(s);};
  var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s));};
  var pad=$('#pad'), ctx=pad.getContext('2d');
  var state={tool:'pen',size:3,color:'#1E3D4C'};
  var objects=[], dpr=Math.max(1,window.devicePixelRatio||1);
  var W=0,H=0;

  /* title from ?title= or #comp= */
  (function(){
    var t=null;
    try{var p=new URLSearchParams(location.search);t=p.get('title')||p.get('comp');}catch(e){}
    if(!t&&location.hash){var m=location.hash.match(/(?:title|comp)=([^&]+)/);if(m)t=decodeURIComponent(m[1].replace(/\+/g,' '));}
    if(t){t=t.replace(/[<>]/g,'');$('#title').textContent=t;document.title=t+' · Drawing Canvas';}
  })();

  function resize(){
    var wrap=pad.parentElement, r=wrap.getBoundingClientRect();
    W=Math.max(320,Math.floor(r.width)); H=Math.max(360,Math.floor(r.height));
    pad.width=W*dpr; pad.height=H*dpr; pad.style.width=W+'px'; pad.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    redraw();
  }
  window.addEventListener('resize',resize);

  function stroke(o){
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.strokeStyle=o.erase?'#FFFFFF':o.color; ctx.fillStyle=o.erase?'#FFFFFF':o.color; ctx.lineWidth=o.size;
    if(o.tool==='pen'||o.tool==='erase'){
      ctx.beginPath(); var pts=o.pts; if(!pts.length)return;
      ctx.moveTo(pts[0].x,pts[0].y);
      for(var i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
      if(pts.length===1){ctx.lineTo(pts[0].x+0.1,pts[0].y+0.1);}
      ctx.stroke();
    }else if(o.tool==='line'||o.tool==='arrow'){
      ctx.beginPath(); ctx.moveTo(o.x0,o.y0); ctx.lineTo(o.x1,o.y1); ctx.stroke();
      if(o.tool==='arrow'){
        var ang=Math.atan2(o.y1-o.y0,o.x1-o.x0), h=Math.max(9,o.size*3);
        ctx.beginPath(); ctx.moveTo(o.x1,o.y1);
        ctx.lineTo(o.x1-h*Math.cos(ang-0.4),o.y1-h*Math.sin(ang-0.4));
        ctx.moveTo(o.x1,o.y1);
        ctx.lineTo(o.x1-h*Math.cos(ang+0.4),o.y1-h*Math.sin(ang+0.4));
        ctx.stroke();
      }
    }else if(o.tool==='rect'){
      ctx.strokeRect(Math.min(o.x0,o.x1),Math.min(o.y0,o.y1),Math.abs(o.x1-o.x0),Math.abs(o.y1-o.y0));
    }else if(o.tool==='circle'){
      ctx.beginPath();
      ctx.ellipse((o.x0+o.x1)/2,(o.y0+o.y1)/2,Math.abs(o.x1-o.x0)/2,Math.abs(o.y1-o.y0)/2,0,0,Math.PI*2);
      ctx.stroke();
    }else if(o.tool==='text'){
      ctx.font='700 '+Math.max(13,o.size*5.5)+'px '+"'Plus Jakarta Sans Variable','Plus Jakarta Sans',sans-serif";
      ctx.textBaseline='top'; ctx.fillText(o.text,o.x,o.y);
    }
  }
  function redraw(prev){
    ctx.save(); ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,W,H);
    objects.forEach(stroke);
    if(prev)stroke(prev);
    ctx.restore();
  }

  function pos(e){var r=pad.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
  var drawing=false, cur=null;
  pad.addEventListener('pointerdown',function(e){
    e.preventDefault(); pad.setPointerCapture(e.pointerId); var p=pos(e);
    if(state.tool==='text'){
      var txt=window.prompt('Text to place:'); if(txt){objects.push({tool:'text',color:state.color,size:state.size,x:p.x,y:p.y,text:txt});redraw();}
      return;
    }
    drawing=true;
    if(state.tool==='pen'||state.tool==='erase'){cur={tool:state.tool,erase:state.tool==='erase',color:state.color,size:state.tool==='erase'?Math.max(state.size,12):state.size,pts:[p]};}
    else{cur={tool:state.tool,color:state.color,size:state.size,x0:p.x,y0:p.y,x1:p.x,y1:p.y};}
  });
  pad.addEventListener('pointermove',function(e){
    if(!drawing||!cur)return; var p=pos(e);
    if(cur.tool==='pen'||cur.tool==='erase'){cur.pts.push(p);redraw(cur);}
    else{cur.x1=p.x;cur.y1=p.y;redraw(cur);}
  });
  function end(){if(drawing&&cur){objects.push(cur);}drawing=false;cur=null;redraw();}
  pad.addEventListener('pointerup',end);
  pad.addEventListener('pointercancel',end);
  pad.addEventListener('pointerleave',function(e){if(drawing)end();});

  /* tool + size + color selection */
  function press(sel,btn){$$(sel).forEach(function(b){b.setAttribute('aria-pressed','false');});btn.setAttribute('aria-pressed','true');}
  $$('.tool').forEach(function(b){b.addEventListener('click',function(){state.tool=b.getAttribute('data-tool');press('.tool',b);pad.style.cursor=(state.tool==='text')?'text':'crosshair';});});
  $$('.sizebtn').forEach(function(b){b.addEventListener('click',function(){state.size=parseFloat(b.getAttribute('data-size'));press('.sizebtn',b);});});
  $$('.swatch').forEach(function(b){b.addEventListener('click',function(){state.color=b.getAttribute('data-color');press('.swatch',b);$('#customColor').value=state.color;});});
  $('#customColor').addEventListener('input',function(){state.color=this.value;$$('.swatch').forEach(function(b){b.setAttribute('aria-pressed','false');});});

  /* undo / clear */
  $('#undo').addEventListener('click',function(){objects.pop();redraw();});
  $('#clear').addEventListener('click',function(){if(objects.length&&!window.confirm('Clear the whole canvas?'))return;objects=[];redraw();});

  /* save PDF */
  $('#savePdf').addEventListener('click',function(){
    try{
      var jsPDF=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF; if(!jsPDF){window.print();return;}
      var land=W>=H;
      var pdf=new jsPDF({orientation:land?'landscape':'portrait',unit:'pt',format:'letter'});
      var pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight(), margin=36;
      var title=$('#title').textContent||'Drawing';
      pdf.setFont('helvetica','bold'); pdf.setFontSize(13); pdf.setTextColor('#1E3D4C');
      pdf.text(title,margin,margin);
      pdf.setFont('helvetica','normal'); pdf.setFontSize(9); pdf.setTextColor('#666666');
      pdf.text('BIO 004 Human Anatomy · '+new Date().toLocaleDateString(),margin,margin+15);
      var img=pad.toDataURL('image/png');
      var availW=pw-margin*2, availH=ph-margin*2-30;
      var ratio=Math.min(availW/W,availH/H), dw=W*ratio, dh=H*ratio;
      pdf.addImage(img,'PNG',margin,margin+28,dw,dh);
      var safe=title.replace(/[^a-z0-9]+/gi,'-').toLowerCase().slice(0,40)||'drawing';
      pdf.save(safe+'.pdf');
    }catch(err){window.print();}
  });
  $('#printBtn').addEventListener('click',function(){window.print();});

  /* iframe height sender (harmless when opened full screen) */
  function sendH(){try{parent.postMessage({type:'resize',id:'mastery-canvas',height:document.documentElement.scrollHeight},'*');}catch(e){}}
  window.addEventListener('load',sendH); window.addEventListener('resize',sendH);

  resize();
})();
</script>

<style>
/* ---- Split screen self-check, added 2026-08-11 ----
   The checklist, the confidence rating and the score all live beside the
   drawing, so nothing has to be memorised on a round trip to another screen. */
.checkpanel{width:min(430px,42vw);flex:0 0 auto;margin-left:14px;background:var(--white);
  border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);
  padding:18px 20px;overflow-y:auto;max-height:100%;font-family:var(--disp)}
.checkpanel[hidden]{display:none}
.cp-eyebrow{font-family:'DM Sans',var(--disp);font-size:11px;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:var(--terra-dark);margin:0 0 6px}
.cp-h{font-size:18px;font-weight:700;color:var(--navy);margin:0 0 4px;line-height:1.25}
.cp-sub{font-size:14px;color:var(--ink-soft);margin:0 0 16px}
.cp-count{font-size:13px;font-weight:700;color:var(--navy);background:var(--navy-tint);
  border:1px solid var(--line);border-radius:999px;padding:4px 12px;display:inline-block;margin-bottom:12px}
.cp-list{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:7px}
.cp-item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--white);
  border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font:inherit;
  font-size:14px;color:var(--navy);line-height:1.4;min-height:44px}
.cp-item:hover{border-color:var(--navy)}
.cp-item[aria-pressed="true"]{background:var(--navy-tint);border-color:var(--navy)}
.cp-box{flex:0 0 auto;width:18px;height:18px;border:1.5px solid var(--navy);border-radius:4px;margin-top:1px;position:relative}
.cp-item[aria-pressed="true"] .cp-box::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;
  border:solid var(--navy);border-width:0 2px 2px 0;transform:rotate(45deg)}
.cp-btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.cp-b{font-family:var(--disp);font-size:14px;font-weight:700;color:var(--navy);background:var(--white);
  border:1px solid var(--navy);border-radius:999px;padding:10px 18px;cursor:pointer;min-height:44px;
  transition:background 200ms ease,color 200ms ease}
.cp-b:hover:not(:disabled){background:var(--navy);color:var(--white)}
.cp-b.gold{border-color:var(--gold)}
.cp-b.gold:hover:not(:disabled){background:var(--gold);color:var(--navy)}
.cp-b:focus-visible,.cp-item:focus-visible,#checkBtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.cp-b:disabled{opacity:.45;cursor:default}
.cp-msg{margin:14px 0 0;font-size:14px;font-weight:600;color:var(--ok,#1E4C33);min-height:1.2em}
.cp-note{margin:14px 0 0;font-size:13px;color:var(--ink-soft);line-height:1.5}
.cp-hr{border:0;border-top:1px solid var(--line);margin:18px 0}
@media (max-width:900px){
  .stage{flex-direction:column}
  .checkpanel{width:auto;margin:14px 0 0;max-height:none}
}
@media (prefers-reduced-motion: reduce){.cp-b,.cp-item{transition:none}}

  .stage{padding:0}.canvas-wrap{border:0;box-shadow:none}}

<script>
/* ============================================================
   Split-screen self-check, confidence, scoring and print.
   Added 2026-08-11.

   Before this, the canvas had no storage call of any kind, so a drawing
   made here produced no evidence at all, and the checklist lived on a
   different screen entirely. A student had to hold 17 items in their head
   while switching back and forth.

   Now: canvas on the left, checklist on the right, tick as you compare,
   score without leaving the page. Confidence is asked BEFORE the checklist
   is revealed, because a rating taken after seeing the answers is not a
   confidence rating, it is a memory of the answers. If Mastery OS already
   collected it (?conf=), it carries through and is not asked twice.

   Writes one row to bio004-evidence-v1 in the shape mastery-evidence.js
   reads, plus the confidence pairing:
       { comp, source:'draw', got, of, conf, at }
   ============================================================ */
(function(){
  var EV_KEY='bio004-evidence-v1';
  var p; try{p=new URLSearchParams(location.search);}catch(e){return;}
  var comp=p.get('comp')||'';
  if(!comp)return;                       /* plain scratch pad, panel stays off */
  var name=(p.get('title')||'this structure').replace(/[<>&]/g,'');
  var conf=p.get('conf')||'';

  var panel=document.getElementById('checkPanel');
  var btn=document.getElementById('checkBtn');
  if(!panel||!btn)return;
  btn.hidden=false;

  /* her worksheet checklist for this competency */
  var items=[],code='',dname='';
  var D=window.BIO004_DRAW||[];
  for(var i=0;i<D.length;i++){
    if((D[i].comps||[]).indexOf(comp)>=0&&D[i].items&&D[i].items.length){
      items=D[i].items;code=D[i].code||'';dname=D[i].name||'';break;
    }
  }

  var ticked={},scored=false;
  function esc(t){return String(t).replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];});}

  function open(){
    panel.hidden=false;btn.textContent='Hide checklist';
    window.dispatchEvent(new Event('resize'));
    if(!conf)askConf(); else showList();
    var f=panel.querySelector('button');if(f)f.focus();
  }
  function close(){panel.hidden=true;btn.textContent='Check my work';window.dispatchEvent(new Event('resize'));}
  btn.addEventListener('click',function(){panel.hidden?open():close();});

  function askConf(){
    panel.innerHTML=
      '<p class="cp-eyebrow">Before you look</p>'+
      '<h2 class="cp-h">How well do you think you did?</h2>'+
      '<p class="cp-sub">Answer before the checklist appears. Being sure and being right are different things, and the gap between them is the useful part.</p>'+
      '<div class="cp-btns">'+
        '<button type="button" class="cp-b" data-c="low">Shaky</button>'+
        '<button type="button" class="cp-b" data-c="med">Fairly sure</button>'+
        '<button type="button" class="cp-b gold" data-c="high">Confident</button>'+
      '</div>';
    panel.querySelectorAll('[data-c]').forEach(function(b){
      b.addEventListener('click',function(){conf=b.getAttribute('data-c');showList();});
    });
  }

  function confLabel(){return {low:'Shaky',med:'Fairly sure',high:'Confident'}[conf]||'not recorded';}

  function showList(){
    var head=
      '<p class="cp-eyebrow">Compare against your drawing</p>'+
      '<h2 class="cp-h">'+(code?esc(code)+', ':'')+esc(dname||name)+'</h2>'+
      '<p class="cp-sub">Tick every item you actually drew. Be honest, this is your score. You went in: <strong>'+confLabel()+'</strong>.</p>';
    if(!items.length){
      panel.innerHTML=head+
        '<p class="cp-note">There is no checklist for this competency yet. Compare your drawing against your notes, the structure list, or the atlas, then score yourself.</p>'+
        gradeBlock();
      wireGrade();return;
    }
    panel.innerHTML=head+
      '<span class="cp-count" id="cpCount">0 of '+items.length+'</span>'+
      '<ul class="cp-list">'+items.map(function(x,n){
        return '<li><button type="button" class="cp-item" data-i="'+n+'" aria-pressed="false"><span class="cp-box" aria-hidden="true"></span><span>'+esc(x)+'</span></button></li>';
      }).join('')+'</ul>'+gradeBlock();
    panel.querySelectorAll('.cp-item').forEach(function(b){
      b.addEventListener('click',function(){
        var n=b.getAttribute('data-i');ticked[n]=!ticked[n];
        b.setAttribute('aria-pressed',ticked[n]?'true':'false');
        var got=Object.keys(ticked).filter(function(k){return ticked[k];}).length;
        var el=document.getElementById('cpCount');if(el)el.textContent=got+' of '+items.length;
      });
    });
    wireGrade();
  }

  function gradeBlock(){
    return '<hr class="cp-hr">'+
      '<p class="cp-eyebrow">Score it</p>'+
      '<h2 class="cp-h" style="font-size:16px">How complete were you?</h2>'+
      '<div class="cp-btns">'+
        '<button type="button" class="cp-b" data-got="2">Patchy</button>'+
        '<button type="button" class="cp-b" data-got="4">Solid</button>'+
        '<button type="button" class="cp-b gold" data-got="6">Thorough</button>'+
      '</div>'+
      '<p class="cp-msg" role="status" aria-live="polite"></p>'+
      '<hr class="cp-hr">'+
      '<p class="cp-eyebrow">Keep it</p>'+
      '<p class="cp-note">Happy with this one? <strong>Save PDF</strong> keeps a copy you can revise from, and <strong>Print</strong> gives you a paper version. Both are in the top bar, and neither includes this panel.</p>'+
      '<div class="cp-btns" style="margin-top:10px">'+
        '<button type="button" class="cp-b" id="cpPdf">Save PDF</button>'+
        '<button type="button" class="cp-b" id="cpPrint">Print drawing</button>'+
      '</div>';
  }

  function wireGrade(){
    panel.querySelectorAll('[data-got]').forEach(function(b){
      b.addEventListener('click',function(){record(parseInt(b.getAttribute('data-got'),10));});
    });
    var pdf=panel.querySelector('#cpPdf'),pr=panel.querySelector('#cpPrint');
    if(pdf)pdf.addEventListener('click',function(){var t=document.getElementById('savePdf');if(t)t.click();});
    if(pr)pr.addEventListener('click',function(){window.print();});
  }

  function record(got){
    if(scored)return;
    var log=[];
    try{log=JSON.parse(localStorage.getItem(EV_KEY)||'[]');if(!Array.isArray(log))log=[];}catch(e){log=[];}
    log.push({comp:comp,source:'draw',got:got,of:6,conf:conf||null,at:new Date().toISOString()});
    var msg=panel.querySelector('.cp-msg');
    try{localStorage.setItem(EV_KEY,JSON.stringify(log));}
    catch(e){if(msg){msg.style.color='var(--bad,#7A2E2E)';msg.textContent='Could not save. Your browser is blocking site storage for this page.';}return;}
    scored=true;
    panel.querySelectorAll('[data-got]').forEach(function(b){b.disabled=true;});
    if(!msg)return;
    if(conf==='high'&&got<=2){
      msg.textContent='Saved. You went in confident and came out patchy. That is the most useful thing you could have found today, and it puts this near the top of your weak spot board.';
    }else if(conf==='low'&&got>=6){
      msg.textContent='Saved. You knew that better than you thought. Trust yourself more on this one.';
    }else{
      msg.textContent='Saved. Mastery OS will show this the next time you open it.';
    }
  }
})();
</script>

</body>
</html>
